<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" rx="200" fill="#090d16" />
  <rect width="1024" height="1024" fill="url(#bgGlow)" />

  <!-- Outer Neon Circle -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="#10b981" stroke-width="14" stroke-dasharray="14 0" />

  <!-- Central Monogram C&V -->
  <text x="512" y="440" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="310" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">
    C&amp;V
  </text>

  <!-- Divider Line -->
  <line x1="260" y1="600" x2="764" y2="600" stroke="#10b981" stroke-width="8" stroke-linecap="round" />

  <!-- Subtitle -->
  <text x="512" y="685" font-family="'Arial', sans-serif" font-weight="800" font-size="64" fill="#10b981" letter-spacing="8" text-anchor="middle" dominant-baseline="middle">
    COMPRA &amp; VAREJO
  </text>

  <!-- Location Tagline -->
  <text x="512" y="765" font-family="'Arial', sans-serif" font-weight="600" font-size="40" fill="#94a3b8" letter-spacing="4" text-anchor="middle" dominant-baseline="middle">
    ITU • PRONTA ENTREGA
  </text>
</svg>
